<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAMGPT</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #0b0d12;
    color: #f4f7fb;

    overflow: hidden;
}

.app {

    width: 100vw;
    height: 100vh;

    display: flex;

    background:
        radial-gradient(
            circle at top right,
            rgba(25,195,125,0.08),
            transparent 30%
        ),
        #0b0d12;
}

.sidebar {

    width: 260px;
    height: 100%;

    background: rgba(18,21,29,0.96);

    border-right: 1px solid #252a35;

    display: flex;
    flex-direction: column;

    padding: 18px 14px;

    flex-shrink: 0;
}

.logo {

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px 12px 22px;
}

.logo-icon {

    width: 38px;
    height: 38px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #19c37d,
            #0f9f68
        );

    font-size: 20px;

    box-shadow:
        0 8px 25px rgba(25,195,125,0.18);
}

.logo-text {

    font-size: 20px;
    font-weight: 750;

    letter-spacing: -0.5px;
}

.new-chat {

    width: 100%;

    border: 1px solid #303745;

    background: #1b2029;

    color: #f5f7fb;

    border-radius: 12px;

    padding: 12px 14px;

    font-size: 14px;

    cursor: pointer;

    transition: 0.2s;

    text-align: left;

    margin-bottom: 25px;
}

.new-chat:hover {

    background: #242b36;

    border-color: #3a4352;

    transform: translateY(-1px);
}

.section-title {

    color: #6f7888;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1px;

    padding: 0 12px 9px;
}

.chat-history {

    display: flex;

    flex-direction: column;

    gap: 5px;

    overflow-y: auto;
}

.history-row {

    display: flex;

    align-items: center;

    gap: 4px;
}

.history-item {

    flex: 1;

    min-width: 0;

    border: none;

    background: transparent;

    color: #aeb6c4;

    border-radius: 10px;

    padding: 10px 12px;

    text-align: left;

    font-size: 13px;

    cursor: pointer;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    transition: 0.2s;
}

.history-item:hover {

    background: #1d232d;

    color: white;
}

.history-item.active {

    background: #202731;

    color: white;
}

.delete-chat {

    width: 30px;
    height: 30px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #6f7888;

    cursor: pointer;

    flex-shrink: 0;

    transition: 0.2s;
}

.delete-chat:hover {

    background: #302027;

    color: #ff6b6b;
}

.sidebar-bottom {

    margin-top: auto;

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.sidebar-button {

    width: 100%;

    border: none;

    background: transparent;

    color: #aeb6c4;

    padding: 11px 12px;

    border-radius: 10px;

    text-align: left;

    cursor: pointer;

    font-size: 13px;

    transition: 0.2s;
}

.sidebar-button:hover {

    background: #1d232d;

    color: white;
}

.main {

    flex: 1;

    height: 100%;

    min-width: 0;

    display: flex;

    flex-direction: column;
}

.header {

    height: 66px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    border-bottom: 1px solid #252a35;

    background: rgba(11,13,18,0.85);

    backdrop-filter: blur(15px);
}

.header-left {

    display: flex;

    align-items: center;

    gap: 12px;
}

.header-title {

    font-size: 16px;

    font-weight: 700;
}

.online {

    display: flex;

    align-items: center;

    gap: 5px;

    color: #19c37d;

    font-size: 11px;

    font-weight: 600;
}

.online-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #19c37d;

    box-shadow:
        0 0 8px rgba(25,195,125,0.8);
}

.header-actions {

    display: flex;

    gap: 7px;
}

.icon-button {

    width: 36px;
    height: 36px;

    border: 1px solid #282e39;

    background: #151922;

    color: #aeb6c4;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

    transition: 0.2s;
}

.icon-button:hover {

    color: white;

    background: #202631;

    border-color: #394252;
}

.chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 30px 8%;
}

.chat::-webkit-scrollbar {

    width: 7px;
}

.chat::-webkit-scrollbar-track {

    background: transparent;
}

.chat::-webkit-scrollbar-thumb {

    background: #2b313c;

    border-radius: 10px;
}

.welcome {

    max-width: 700px;

    margin: 8vh auto 0;

    text-align: center;
}

.welcome-logo {

    width: 68px;
    height: 68px;

    margin: auto auto 20px;

    border-radius: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 32px;

    background:
        linear-gradient(
            135deg,
            #19c37d,
            #0e8f5e
        );

    box-shadow:
        0 15px 45px rgba(25,195,125,0.15);
}

.welcome h1 {

    font-size: 31px;

    letter-spacing: -1px;

    margin-bottom: 10px;
}

.welcome p {

    color: #7f8999;

    font-size: 14px;

    line-height: 1.6;
}

.suggestions {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 10px;

    margin-top: 28px;
}

.suggestion {

    padding: 14px;

    background: #131720;

    border: 1px solid #252b36;

    border-radius: 13px;

    color: #b8c0cc;

    text-align: left;

    cursor: pointer;

    transition: 0.2s;

    font-size: 13px;
}

.suggestion:hover {

    background: #1a202a;

    border-color: #384251;

    color: white;

    transform: translateY(-2px);
}

.message {

    display: flex;

    gap: 13px;

    max-width: 850px;

    margin: 0 auto 22px;

    animation: messageIn 0.25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {

    justify-content: flex-end;
}

.avatar {

    width: 34px;
    height: 34px;

    flex-shrink: 0;

    border-radius: 11px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 15px;

    background: #1e2530;

    border: 1px solid #2b323e;
}

.message.user .avatar {

    order: 2;

    background: #19c37d;

    border-color: #19c37d;
}

.bubble {

    max-width: 72%;

    padding: 13px 16px;

    border-radius: 15px;

    color: #e9edf3;

    font-size: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;
}

.message.bot .bubble {

    background: #151a22;

    border: 1px solid #252c37;

    border-top-left-radius: 5px;
}

.message.user .bubble {

    background: #1b7657;

    border: 1px solid #269b73;

    border-top-right-radius: 5px;

    color: white;
}

.input-area {

    flex-shrink: 0;

    padding:
        10px
        8%
        20px;
}

.input-wrapper {

    max-width: 850px;

    margin: auto;

    display: flex;

    align-items: flex-end;

    gap: 8px;

    padding: 8px;

    background: #151a22;

    border: 1px solid #303744;

    border-radius: 17px;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.22);

    transition: 0.2s;
}

.input-wrapper:focus-within {

    border-color: #19c37d;

    box-shadow:
        0 0 0 3px rgba(25,195,125,0.08);
}

#messageInput {

    flex: 1;

    min-height: 24px;

    max-height: 150px;

    resize: none;

    border: none;

    outline: none;

    background: transparent;

    color: #f4f7fb;

    font-family: inherit;

    font-size: 14px;

    line-height: 1.5;

    padding: 8px 9px;
}

#messageInput::placeholder {

    color: #626c7b;
}

.send-button {

    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border: none;

    border-radius: 12px;

    background: #19c37d;

    color: white;

    cursor: pointer;

    font-size: 18px;

    transition: 0.2s;

    display: flex;

    align-items: center;
    justify-content: center;
}

.send-button:hover {

    background: #16ad6f;

    transform: translateY(-1px);
}

.send-button:active {

    transform: scale(0.95);
}

.hint {

    text-align: center;

    color: #555f6f;

    font-size: 9px;

    margin-top: 8px;
}

.modal-overlay {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background: rgba(0,0,0,0.65);

    backdrop-filter: blur(7px);

    z-index: 100;
}

.modal-overlay.show {

    display: flex;
}

.modal {

    width: min(500px, calc(100vw - 30px));

    max-height: 85vh;

    overflow-y: auto;

    background: #171b23;

    border: 1px solid #303744;

    border-radius: 18px;

    padding: 24px;

    box-shadow:
        0 30px 100px rgba(0,0,0,0.5);
}

.modal h2 {

    font-size: 19px;

    margin-bottom: 8px;
}

.modal p {

    color: #8b95a4;

    font-size: 13px;

    line-height: 1.6;

    margin-bottom: 20px;
}

.modal-close {

    width: 100%;

    padding: 11px;

    border: none;

    border-radius: 10px;

    background: #19c37d;

    color: white;

    cursor: pointer;

    font-weight: 600;
}

.profile-grid {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 20px;
}

.profile-field {

    display: flex;

    flex-direction: column;

    gap: 6px;
}

.profile-field.full {

    grid-column: 1 / -1;
}

.profile-field label {

    color: #aeb6c4;

    font-size: 12px;

    font-weight: 600;
}

.profile-field input,
.profile-field textarea {

    width: 100%;

    border: 1px solid #303744;

    background: #10141b;

    color: white;

    border-radius: 10px;

    padding: 10px;

    outline: none;

    font-family: inherit;

    font-size: 13px;
}

.profile-field input:focus,
.profile-field textarea:focus {

    border-color: #19c37d;
}

.profile-field textarea {

    min-height: 70px;

    resize: vertical;
}

.profile-actions {

    display: flex;

    gap: 8px;
}

.profile-save {

    flex: 1;

    padding: 11px;

    border: none;

    border-radius: 10px;

    background: #19c37d;

    color: white;

    cursor: pointer;

    font-weight: 600;
}

.profile-cancel {

    padding: 11px 16px;

    border: 1px solid #303744;

    border-radius: 10px;

    background: #202631;

    color: white;

    cursor: pointer;
}


body.light-theme {
    background: #f4f7fb;
    color: #18202b;
}

body.light-theme .app { background: #f4f7fb; }
body.light-theme .sidebar,
body.light-theme .header { background: rgba(255,255,255,0.96); }
body.light-theme .sidebar { border-right-color: #dfe4eb; }
body.light-theme .header { border-bottom-color: #dfe4eb; }
body.light-theme .header-title,
body.light-theme .welcome h1 { color: #18202b; }
body.light-theme .welcome p,
body.light-theme .section-title { color: #667085; }
body.light-theme .suggestion,
body.light-theme .input-wrapper,
body.light-theme .message.bot .bubble,
body.light-theme .icon-button { background: #ffffff; border-color: #dfe4eb; color: #344054; }
body.light-theme #messageInput { color: #18202b; }
body.light-theme #messageInput::placeholder { color: #98a2b3; }
body.light-theme .history-item,
body.light-theme .sidebar-button { color: #667085; }
body.light-theme .history-item:hover,
body.light-theme .sidebar-button:hover { background: #eef2f6; color: #18202b; }
body.light-theme .new-chat { background: #f1f4f8; color: #18202b; border-color: #dfe4eb; }

@media (max-width: 800px) {

    .sidebar {
        width: 210px;
    }

    .chat {
        padding-left: 20px;
        padding-right: 20px;
    }

    .input-area {
        padding-left: 20px;
        padding-right: 20px;
    }

    .bubble {
        max-width: 85%;
    }
}

@media (max-width: 620px) {

    .sidebar {
        width: 70px;

        padding-left: 8px;
        padding-right: 8px;
    }

    .logo-text,
    .new-chat,
    .section-title,
    .history-item,
    .sidebar-button {

        font-size: 0;

        padding-left: 0;
        padding-right: 0;

        text-align: center;
    }

    .logo {

        justify-content: center;

        padding-left: 0;
        padding-right: 0;
    }

    .logo-icon {

        width: 40px;
        height: 40px;
    }

    .delete-chat {

        display: none;
    }

    .suggestions {

        grid-template-columns: 1fr;
    }

    .welcome h1 {

        font-size: 25px;
    }

    .profile-grid {

        grid-template-columns: 1fr;
    }

    .profile-field.full {

        grid-column: auto;
    }
}

</style>

</head>

<script>

let profilUtilisateur = {

    prenom: "",
    age: "",
    sport: [],
    jeux: [],
    couleur: "",
    passion: "",
    pays: "",
    classe: "",
    animalPrefere: "",
    filmPrefere: "",
    musiquePreferee: ""

};

let conversation = [];

let historique = [];

let chatActuel = null;

// Sujet actuellement discuté.
// topic = grand thème, subtopic = élément précis dont on vient de parler.
let contexte = {
    topic: "",
    subtopic: ""
};

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const welcome =
    document.getElementById("welcome");

const historyContainer =
    document.getElementById("chatHistory");

const modal =
    document.getElementById("modalOverlay");

const modalTitle =
    document.getElementById("modalTitle");

const modalContent =
    document.getElementById("modalContent");

const modalClose =
    document.getElementById("modalClose");


function nettoyer(texte) {

    return String(texte || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[’']/g, " ")
        // Langage courant / raccourcis / fautes très fréquentes
        .replace(/\b(?:c|s)\s*quoi\b/g, "c est quoi")
        .replace(/\bc\s*koi\b/g, "c est quoi")
        .replace(/\bkeske\b/g, "qu est ce que")
        .replace(/\bke\s*sk\b/g, "qu est ce que")
        .replace(/\bqsk\b/g, "qu est ce que")
        .replace(/\bpk\b/g, "pourquoi")
        .replace(/\bpq\b/g, "pourquoi")
        .replace(/\bprk\b/g, "pourquoi")
        .replace(/\bkomment\b/g, "comment")
        .replace(/\bcomment\b/g, "comment")
        .replace(/\bcomen\b/g, "comment")
        .replace(/\bcomt\b/g, "comment")
        .replace(/\bkel\b/g, "quel")
        .replace(/\bkele\b/g, "quelle")
        .replace(/\bkoi\b/g, "quoi")
        .replace(/\bki\b/g, "qui")
        .replace(/\bqel\b/g, "quel")
        .replace(/\bqelle\b/g, "quelle")
        .replace(/\bpcq\b/g, "parce que")
        .replace(/\bparske\b/g, "parce que")
        .replace(/\bjsais\b/g, "je sais")
        .replace(/\bjveu(?:x)?\b/g, "je veux")
        .replace(/\bjvoudrais\b/g, "je voudrais")
        .replace(/\bexplik\b/g, "explique")
        .replace(/\bexplique\s+moi\b/g, "explique moi")
        .replace(/\bstp\b/g, "s il te plait")
        .replace(/\bsvp\b/g, "s il vous plait")
        .replace(/\bsvp\b/g, "s il vous plait")
        .replace(/\bmm\b/g, "meme")
        .replace(/\bbcp\b/g, "beaucoup")
        .replace(/\bqqch\b/g, "quelque chose")
        .replace(/\bqq\b/g, "quelque")
        .replace(/\bpr\b/g, "pour")
        .replace(/\bds\b/g, "dans")
        .replace(/\bavec\b/g, "avec")
        // Quelques fautes de frappe très courantes
        .replace(/\baujoudhui\b/g, "aujourd hui")
        .replace(/\baujordhui\b/g, "aujourd hui")
        .replace(/\bcommen\b/g, "comment")
        .replace(/\bfonctinne\b/g, "fonctionne")
        .replace(/\bfonctione\b/g, "fonctionne")
        .replace(/\bmarche\b/g, "marche")
        // On conserve les chiffres et les opérateurs pour les calculs.
        // Les slashs sont conservés pour que les commandes /questions etc. restent détectables.
        .replace(/[^a-z0-9+\-*/().%/?\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/*
   SAMGPT est volontairement très tolérant.
   Il peut comprendre :
   - les accents oubliés
   - les apostrophes oubliées
   - les mots collés (mappelle, cquoi, etc.)
   - beaucoup de petites fautes de frappe
   - des formulations différentes d'une même question
*/
function compact(texte) {
    return nettoyer(texte).replace(/\s+/g, "");
}


function distanceLevenshtein(a, b) {

    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;

    const ligne = Array.from({ length: b.length + 1 }, (_, i) => i);

    for (let i = 1; i <= a.length; i++) {

        let precedent = ligne[0];
        ligne[0] = i;

        for (let j = 1; j <= b.length; j++) {

            const ancien = ligne[j];
            const cout = a[i - 1] === b[j - 1] ? 0 : 1;

            ligne[j] = Math.min(
                ligne[j] + 1,
                ligne[j - 1] + 1,
                precedent + cout
            );

            precedent = ancien;
        }
    }

    return ligne[b.length];
}


function motProche(mot, cible) {

    if (!mot || !cible) return false;
    if (mot === cible) return true;

    // Très courts mots : on évite les faux positifs
    if (cible.length <= 2) {
        return distanceLevenshtein(mot, cible) <= 1;
    }

    const distance = distanceLevenshtein(mot, cible);
    const longueur = Math.max(mot.length, cible.length);

    // Plus le mot est long, plus on autorise de petites fautes.
    let maximum = 1;
    if (longueur >= 7) maximum = 2;
    if (longueur >= 11) maximum = 3;

    return distance <= maximum && distance / longueur <= 0.35;
}


function phraseProche(question, cible) {

    const q = nettoyer(question);
    const c = nettoyer(cible);

    if (!q || !c) return false;
    if (q === c) return true;
    if (q.includes(c) || c.includes(q)) return true;

    const qc = compact(q);
    const cc = compact(c);

    if (qc === cc || qc.includes(cc) || cc.includes(qc)) {
        return true;
    }

    const qWords = q.split(" ").filter(Boolean);
    const cWords = c.split(" ").filter(Boolean);

    // Pour une phrase, tous les mots importants de la cible
    // doivent être retrouvés, même avec une petite faute.
    if (cWords.length > 1) {

        const correspondances = cWords.filter(cw =>
            qWords.some(qw => motProche(qw, cw))
        );

        if (correspondances.length === cWords.length) {
            return true;
        }
    }

    const distance = distanceLevenshtein(qc, cc);
    const longueur = Math.max(qc.length, cc.length);

    return longueur > 2 && distance / longueur <= 0.32;
}


function contient(texte, mot) {

    const q = nettoyer(texte);
    const cible = nettoyer(mot);

    if (!q || !cible) return false;

    // Cas normal
    if (q.includes(cible)) return true;

    // Cas où l'utilisateur colle les mots
    const qc = compact(q);
    const cc = compact(cible);

    if (qc.includes(cc)) return true;

    // Tolérance aux fautes de frappe
    const qWords = q.split(" ").filter(Boolean);
    const cWords = cible.split(" ").filter(Boolean);

    if (cWords.length === 1) {
        return qWords.some(word => motProche(word, cWords[0]));
    }

    // Pour une expression de plusieurs mots,
    // on vérifie chaque mot séparément.
    return cWords.every(cWord =>
        qWords.some(qWord => motProche(qWord, cWord))
    );
}


function correspond(question, variantes, tolerance = 0.32) {

    return variantes.some(variante =>
        phraseProche(question, variante)
    );
}


function motExact(texte, mots) {

    const q = nettoyer(texte);
    const liste = Array.isArray(mots) ? mots : [mots];

    return liste.some(mot => {
        const cible = nettoyer(mot);
        if (!cible) return false;

        // Expressions de plusieurs mots
        if (cible.includes(" ")) {
            return q.includes(cible);
        }

        return q.split(" ").some(word => {
            return word === cible || motProche(word, cible);
        });
    });
}


function contientAuMoinsUnMot(texte, mots) {
    return mots.some(mot => motExact(texte, mot));
}


function intention(question, variantes) {

    const q = nettoyer(question);

    // Une formulation naturelle peut contenir beaucoup de mots inutiles.
    // On cherche donc une intention dans la phrase plutôt qu'une phrase exacte.
    return variantes.some(variante => {
        const v = nettoyer(variante);

        if (phraseProche(q, v)) return true;

        const mots = v.split(" ").filter(mot => mot.length > 2);
        if (!mots.length) return false;

        const trouves = mots.filter(mot => motExact(q, mot)).length;

        return trouves >= Math.max(1, Math.ceil(mots.length * 0.7));
    });
}

function convertirListe(texte) {

    if (!texte) {
        return [];
    }

    return texte

        .split(",")

        .map(element => element.trim())

        .filter(element => element !== "");

function listeVersTexte(liste) {

    if (!Array.isArray(liste)) {
        return "";
    }

    return liste.join(", ");

function echapperHTML(texte) {

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

}

function ajouterListeUnique(liste, valeur) {

    if (!valeur) {
        return;
    }

    valeur =
        valeur
            .trim()
            .replace(/[.!?]+$/, "");

    if (!valeur) {
        return;
    }

    const elements =
        valeur
            .split(/\s*(?:,| et | & )\s*/i)
            .map(element => element.trim())
            .filter(element => element !== "");

    elements.forEach(element => {

        if (
            !liste.some(
                ancien =>
                    nettoyer(ancien) === nettoyer(element)
            )
        ) {

            liste.push(element);
        }

    });
}

    else if (contient(q, "combien fait")) {

        expression =
            q.replace("combien fait", "").trim();

    if (expression !== "") {

        if (
            !/^[0-9+\-*/().%\s]+$/.test(
                expression
            )
        ) {

            return "❌ Je n'arrive pas à calculer ça.";

        try {

                )();

function definirContexte(topic, subtopic = "") {
    contexte.topic = topic || contexte.topic || "";
    contexte.subtopic = subtopic || "";
    try {
        localStorage.setItem("samgpt_contexte", JSON.stringify(contexte));
    } catch {}
}

function estDemandeDeSujet(q, variantes) {
    return correspond(q, variantes, 0.40);
}

function questionCourteDeSuivi(q) {
    const mots = q.split(" ").filter(Boolean);

    return (
        mots.length <= 8 &&
        (
            contientAuMoinsUn(q, [
                "ca", "cela", "ce", "cette", "cet", "il", "elle", "le", "la", "les", "lui", "sa", "son", "ses", "et"
            ]) ||
            contientAuMoinsUn(q, [
                "pourquoi", "comment", "a quoi", "a quoi ca sert", "ca sert a quoi", "c est quoi", "quoi", "et"
            ])
        )
    );
}

function reponseSujetVoiture() {
    definirContexte("voitures", "voiture");

    return `🚗 OK, on part sur les voitures !

Je garde ce sujet en tête. Tu peux me demander par exemple :

• Comment fonctionne un moteur ?

Tu peux aussi simplement dire « et le turbo ? » ou « ça sert à quoi ? » : je regarderai le contexte. 😎`;
}

Un turbo utilise l'énergie des gaz d'échappement pour comprimer davantage d'air avant son entrée dans le moteur.

Plus d'air disponible permet généralement de brûler davantage de carburant et donc d'obtenir plus de puissance, à moteur de taille comparable.`;

    if (contientAuMoinsUn(q, ["comment", "fonctionne", "marche"])) {
        return turbo();
    }

    return turbo();
}

function contientAuMoinsUn(texte, mots) {
    return mots.some(mot => contient(texte, mot));
}

function repondreAvecContexte(question) {
    const q = nettoyer(question);

    if (!contexte.topic) return "";

    // Si l'utilisateur désigne clairement le dernier élément discuté,
    // on reste dessus au lieu de repartir sur un nouveau sujet.
    if (contexte.topic === "voitures") {

        if (contexte.subtopic === "turbo" && questionCourteDeSuivi(q)) {
            return reponseTurboSuivi(q);
        }

        if (contexte.subtopic === "moteur" && questionCourteDeSuivi(q)) {
            return reponseMoteurSuivi(q);
        }

        if (contexte.subtopic === "couple" && questionCourteDeSuivi(q)) {
            return reponseCoupleSuivi(q);
        }

        if (contexte.subtopic === "puissance" && questionCourteDeSuivi(q)) {
            return reponsePuissanceSuivi(q);
        }

        if (contexte.subtopic === "aerodynamique" && questionCourteDeSuivi(q)) {
            return reponseAerodynamiqueSuivi(q);
        }
    }

    // Les petites relances naturelles comme « et pourquoi ? »,
    // « et après ? », « mais comment ? » restent liées au dernier sujet.
    if (questionCourteDeSuivi(q)) {

        if (contexte.topic === "voitures") {
            if (contexte.subtopic === "turbo") return reponseTurboSuivi(q);
            if (contexte.subtopic === "moteur") return reponseMoteurSuivi(q);
            if (contexte.subtopic === "couple") return reponseCoupleSuivi(q);
            if (contexte.subtopic === "puissance") return reponsePuissanceSuivi(q);
            if (contexte.subtopic === "aerodynamique") return reponseAerodynamiqueSuivi(q);
        }

        // Pour les autres thèmes, on ne renvoie pas une réponse hors sujet :
        // on garde simplement le contexte pour la prochaine question précise.
        if (contexte.topic) {
            definirContexte(contexte.topic, contexte.subtopic);
        }
    }

    return "";
}

function reponseDetailleeSujet(q) {

Un joueur est en position de hors-jeu si, au moment où un coéquipier joue le ballon, il est plus près de la ligne de but adverse que le ballon et l'avant-dernier adversaire.

Mais être en position de hors-jeu n'est pas automatiquement une faute : le joueur doit notamment intervenir dans le jeu selon les règles.

Le point important est donc le moment de la passe, pas le moment où le joueur reçoit le ballon.`;
        }

        if (intention(q, ["comment fonctionne un pressing", "c est quoi un pressing"])) {
            contexte.subtopic = "pressing";
            return `⚽ LE PRESSING

Le pressing consiste à exercer rapidement une pression sur le joueur adverse qui possède le ballon afin de réduire ses solutions.

Un bon pressing dépend du placement, du timing et de la coordination entre plusieurs joueurs. Si un joueur presse seul sans couverture, il peut simplement ouvrir un espace derrière lui.

On peut donc analyser un pressing avec trois questions : qui presse, quelle passe il cherche à empêcher et quel espace l'équipe protège derrière lui.`;

Une boucle sert à répéter une action.

function afficherMessage(
    texte,
    utilisateur = false
) {

    if (welcome) {

        welcome.style.display = "none";
    }


    const message =
        document.createElement("div");

    message.className =
        utilisateur
        ? "message user"
        : "message bot";


    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        utilisateur
        ? "👤"
        : "🤖";


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = texte;


    message.appendChild(avatar);

    message.appendChild(bubble);

    chat.appendChild(message);


    setTimeout(() => {

        chat.scrollTo({

            top: chat.scrollHeight,

            behavior: "smooth"

        });

    }, 30);
}


function envoyer() {

    const question =
        input.value.trim();


    if (!question) {

        return;
    }


    input.value = "";

    ajusterInput();


    afficherMessage(
        question,
        true
    );


    conversation.push({

        role: "user",

        text: question

    });


    const reponse =
        cerveau(question);


    conversation.push({

        role: "bot",

        text: reponse

    });


    afficherMessage(
        reponse,
        false
    );


    sauvegarderConversation();

    sauvegarder();
}


function ajusterInput() {

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";
}


input.addEventListener(
    "input",
    ajusterInput
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            envoyer();
        }

    }
);


sendButton.addEventListener(
    "click",
    envoyer
);


document
    .getElementById("newChatButton")
    .addEventListener(
        "click",
        nouveauChat
    );


function nouveauChat() {

    if (conversation.length > 0) {

        const titre =
            obtenirTitreConversation();

        historique.unshift({

            id:
                Date.now(),

            title:
                titre,

            messages:
                conversation.slice()

        });
    }


    conversation = [];

    chatActuel = null;

    contexte = { topic: "", subtopic: "" };


    supprimerMessages();


    welcome.style.display =
        "block";


    sauvegarder();

    afficherHistorique();

    input.focus();
}


function obtenirTitreConversation() {

    const premierMessage =
        conversation.find(
            message =>
                message.role === "user"
        );


    if (!premierMessage) {

        return "Nouvelle conversation";
    }


    let titre =
        premierMessage.text.trim();


    if (!titre) {

        return "Nouvelle conversation";
    }


    if (titre.length > 28) {

        titre =
            titre.substring(0, 28) +
            "...";
    }


    return titre;
}


function afficherHistorique() {

    historyContainer.innerHTML = "";


    historique.forEach(
        conversationHistorique => {

            if (
                !conversationHistorique ||
                !conversationHistorique.id ||
                !Array.isArray(
                    conversationHistorique.messages
                )
            ) {

                return;
            }


            const row =
                document.createElement("div");

            row.className =
                "history-row";


            const bouton =
                document.createElement("button");

            bouton.className =
                "history-item";


            bouton.textContent =
                "💬 " +
                (
                    conversationHistorique.title ||
                    "Nouvelle conversation"
                );


            bouton.onclick =
                function() {

                    chargerConversation(
                        conversationHistorique.id
                    );

                };


            const supprimer =
                document.createElement("button");

            supprimer.className =
                "delete-chat";

            supprimer.textContent =
                "🗑";


            supprimer.title =
                "Supprimer cette conversation";


            supprimer.onclick =
                function(event) {

                    event.stopPropagation();

                    supprimerConversation(
                        conversationHistorique.id
                    );

                };


            row.appendChild(bouton);

            row.appendChild(supprimer);

            historyContainer.appendChild(row);

        }
    );


    if (historyContainer.children.length === 0) {

        const vide =
            document.createElement("div");

        vide.style.color =
            "#555f6f";

        vide.style.fontSize =
            "12px";

        vide.style.padding =
            "10px 12px";

        vide.textContent =
            "Aucune ancienne conversation.";

        historyContainer.appendChild(vide);
    }
}


function chargerConversation(id) {

    const ancienne =
        historique.find(
            element =>
                element.id === id
        );


    if (!ancienne) {

        return;
    }


    conversation =
        ancienne.messages
            .filter(
                message =>
                    message &&
                    (
                        message.role === "user" ||
                        message.role === "bot"
                    ) &&
                    typeof message.text === "string"
            )
            .map(
                message => ({
                    role: message.role,
                    text: message.text
                })
            );


    chatActuel = id;


    supprimerMessages();


    welcome.style.display =
        "none";


    conversation.forEach(
        message => {

            afficherMessage(
                message.text,
                message.role === "user"
            );

        }
    );


    sauvegarderConversation();
}


function supprimerConversation(id) {

    historique =
        historique.filter(
            conversationHistorique =>
                conversationHistorique.id !== id
        );


    if (chatActuel === id) {

        conversation = [];

        chatActuel = null;

        supprimerMessages();

        welcome.style.display =
            "block";
    }


    sauvegarder();

    afficherHistorique();
}


function supprimerMessages() {

    const messages =
        chat.querySelectorAll(
            ".message"
        );


    messages.forEach(
        message =>
            message.remove()
    );
}


function afficherMemoire() {

    if (
        conversation.length === 0
    ) {

        return "🧠 La mémoire de cette conversation est vide.";
    }


    return (
        "🧠 MÉMOIRE DE LA CONVERSATION\n\n" +

        conversation
            .map(
                message =>
                    message.role === "user"
                    ? "👤 " + message.text
                    : "🤖 " + message.text
            )
            .join("\n\n")
    );
}


function reset() {

    conversation = [];

    chatActuel = null;

    contexte = { topic: "", subtopic: "" };


    supprimerMessages();


    welcome.style.display =
        "block";


    sauvegarderConversation();


    return "🧹 La conversation actuelle a été réinitialisée.";
}

    modal.classList.remove("show");
}


modalClose.addEventListener(

);


modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            fermerModal();
        }

    }
);


document

    );


document
    .getElementById("memoryButton")
    .addEventListener(
        "click",
        function() {
            const texteMemoire = afficherMemoire();
            afficherMessage(texteMemoire, false);
            conversation.push({ role: "bot", text: texteMemoire });
            sauvegarderConversation();
        }
    );


document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        function() {
            const message = reset();
            afficherMessage(message, false);
            sauvegarder();
            input.focus();
        }
    );

function sauvegarder() {

    try {

        localStorage.setItem(
            "samgpt_profil",
            JSON.stringify(
                profilUtilisateur
            )
        );


        localStorage.setItem(
            "samgpt_historique",
            JSON.stringify(
                historique
            )
        );


        localStorage.setItem(
            "samgpt_conversation",
            JSON.stringify(
                conversation
            )
        );

        localStorage.setItem(
            "samgpt_contexte",
            JSON.stringify(contexte)
        );

    }

    catch (erreur) {

        console.warn(
            "Sauvegarde locale impossible.",
            erreur
        );
    }
}


function sauvegarderConversation() {

    try {

        localStorage.setItem(
            "samgpt_conversation",
            JSON.stringify(
                conversation
            )
        );

    }

    catch {

    }
}


function charger() {

    try {
        if (localStorage.getItem("samgpt_theme") === "light") {
            document.body.classList.add("light-theme");
        }

        const profilSauvegarde =
            localStorage.getItem(
                "samgpt_profil"
            );


        const historiqueSauvegarde =
            localStorage.getItem(
                "samgpt_historique"
            );


        const conversationSauvegarde =
            localStorage.getItem(
                "samgpt_conversation"
            );


        if (profilSauvegarde) {

            const profil =
                JSON.parse(
                    profilSauvegarde
                );


            if (
                profil &&
                typeof profil === "object"
            ) {

                profilUtilisateur = {

                    ...profilUtilisateur,

                    ...profil

                };
            }


            if (
                !Array.isArray(
                    profilUtilisateur.sport
                )
            ) {

                profilUtilisateur.sport = [];
            }


            if (
                !Array.isArray(
                    profilUtilisateur.jeux
                )
            ) {

                profilUtilisateur.jeux = [];
            }
        }


        if (historiqueSauvegarde) {

            const donnees =
                JSON.parse(
                    historiqueSauvegarde
                );


            if (
                Array.isArray(donnees)
            ) {

                historique =
                    donnees.filter(
                        element =>
                            element &&
                            element.id &&
                            Array.isArray(
                                element.messages
                            )
                    );


                historique =
                    historique.map(
                        element => ({

                            id:
                                element.id,

                            title:
                                element.title ||
                                "Nouvelle conversation",

                            messages:
                                element.messages.filter(
                                    message =>
                                        message &&
                                        (
                                            message.role === "user" ||
                                            message.role === "bot"
                                        ) &&
                                        typeof message.text === "string"
                                )

                        })
                    );
            }
        }


        if (conversationSauvegarde) {

            const donnees =
                JSON.parse(
                    conversationSauvegarde
                );


            if (
                Array.isArray(donnees)
            ) {

                conversation =
                    donnees.filter(
                        message =>
                            message &&
                            (
                                message.role === "user" ||
                                message.role === "bot"
                            ) &&
                            typeof message.text === "string"
                    );
            }
        }


        const contexteSauvegarde =
            localStorage.getItem("samgpt_contexte");

        if (contexteSauvegarde) {
            const contexteCharge = JSON.parse(contexteSauvegarde);

            if (contexteCharge && typeof contexteCharge === "object") {
                contexte = {
                    topic: contexteCharge.topic || "",
                    subtopic: contexteCharge.subtopic || ""
                };
            }
        }

    }

    catch (erreur) {

        console.warn(
            "Chargement impossible.",
            erreur
        );

        conversation = [];

        historique = [];
    }
}


charger();

afficherHistorique();


if (
    conversation.length > 0
) {

    welcome.style.display =
        "none";


    conversation.forEach(
        message => {

            afficherMessage(
                message.text,
                message.role === "user"
            );

        }
    );
}


input.focus();
